name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: ruff check src tests
      - run: mypy src
      - run: python -m unittest -v tests/test_authz_diff.py
      - run: python -m build
      - name: CLI and SARIF smoke test
        shell: bash
        run: |
          set +e
          authz-diff examples/before.json examples/after.json --format sarif -o /tmp/authz.sarif
          code=$?
          set -e
          test "$code" -eq 1
          python -c 'import json; json.load(open("/tmp/authz.sarif"))'
      - if: matrix.python == '3.12'
        run: pip-audit
